<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ο κωδικός σου άλλαξε - MyHome</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 24px rgba(17,24,39,0.08);">

          <!-- Header -->
          <tr>
            <td align="center" style="background:linear-gradient(135deg,#16a34a,#15803d); padding:40px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="width:56px; height:56px; background-color:rgba(255,255,255,0.15); border-radius:14px;">
                    <span style="font-size:28px; line-height:56px;">✅</span>
                  </td>
                </tr>
              </table>
              <div style="margin-top:16px; color:#ffffff; font-size:22px; font-weight:bold; letter-spacing:0.3px;">MyHome</div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 36px 8px;">
              <h1 style="margin:0 0 8px; font-size:22px; color:#111827;">Ο κωδικός σου άλλαξε{% if first_name %}, {{ first_name }}{% endif %}!</h1>
              <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#4b5563;">
                Ο κωδικός πρόσβασης του λογαριασμού σου στο <strong>MyHome</strong> ενημερώθηκε με επιτυχία. Μπορείς πλέον να συνδεθείς με τον νέο σου κωδικό.
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 36px;">
              <hr style="border:none; border-top:1px solid #e5e7eb; margin:0;">
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 36px 36px;">
              <p style="margin:0; font-size:13px; line-height:1.5; color:#9ca3af;">
                Αν δεν έκανες εσύ αυτή την αλλαγή, επικοινώνησε άμεσα μαζί μας.
              </p>
            </td>
          </tr>

        </table>

        <p style="margin:20px 0 0; font-size:12px; color:#9ca3af;">© MyHome</p>
      </td>
    </tr>
  </table>
</body>
</html>
